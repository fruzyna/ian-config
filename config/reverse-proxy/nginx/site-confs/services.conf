# immich
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name photos.fruzyna.net;

    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://192.168.16.21:2283;
    }
}

# miniflux
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name rss.fruzyna.net;

    include /config/nginx/ssl.conf;
    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass http://host.containers.internal:8020;
